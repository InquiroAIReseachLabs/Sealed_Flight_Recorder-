# Sealed Flight Record workspace (SPEC B1.2).
# One engine (sfr-core), two thin wrappers (sfr CLI, sfr-wasm browser build), and the PKCS#11
# signing helper, which runs as its own process (SPEC B1.2).
# fuzz/ is a separate cargo-fuzz package; it is excluded from the workspace on purpose.
[workspace]
resolver = "3"
members = [
  "crates/sfr-core",
  "crates/sfr",
  "crates/sfr-wasm",
  "crates/sfr-pkcs11-helper",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Sealed Flight Record: a signed, self-verifying record of a PX4 flight's configuration, readiness rule results, and events."

# Dependency pins. Declared here so the members cannot drift; a crate enters Cargo.lock only when a member uses it.
[workspace.dependencies]
# Cryptography (SPEC B1.10 Crypto): the same crates on every target, so a record is byte-identical
# wherever it is sealed. Exact pins: a record names these crate versions (seal.crypto_crates), and
# a unit test holds the names in sfr-core to Cargo.lock. The AWS-LC FIPS module was removed: it
# cannot be linked into a static armv7 binary.
# Certificate path validation (SPEC B1.3 verify --trust-anchor) is not in this build; its crate is
# chosen when certificate chains are implemented.
sha2 = { version = "=0.11.1", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
# Supplementary digest of the raw log bytes; never anchors trust.
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# sfr keygen only: the seed comes from the operating system's CSPRNG.
getrandom = { version = "=0.4.3", default-features = false }
# Rules file parsing (SPEC B1.6). serde_core only, no derive macros; tables are walked by hand
# so unknown keys can be rejected.
toml = { version = "=0.9.12", default-features = false, features = ["parse", "std", "serde"] }
# sfr-pkcs11-helper only: a separate, dynamically linked process (SPEC B1.2).
cryptoki = { version = "=0.12.1" }
# sfr-wasm on wasm32 only: the bindings the sandbox page calls (site/). The JavaScript glue is
# generated by wasm-bindgen-cli of exactly this version (scripts/build_site.sh).
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }

# Workspace-wide lints. Each crate also carries #![forbid(unsafe_code)] at its root
# so the gate is visible in the source file itself (SPEC B1.10, "No unsafe").
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# Static, small, reproducible release binaries (SPEC B1.10, "Static binaries").
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The test suite on armv7 under QEMU (CI): optimized, so the emulated run takes minutes, with
# the debug build's checks kept on (integer overflow and debug assertions; usize is 32 bits).
# Not used for any shipped binary.
[profile.qemu-test]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
panic = "unwind"
strip = "none"
