# cargo-fuzz package for sfr-core (SPEC B1.10, "Fuzzing"). It is not a workspace member: the
# root Cargo.toml excludes fuzz/, and the empty [workspace] below keeps it standalone.
# Build and run with a nightly toolchain: see README.md.
[package]
name = "sfr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
sfr-core = { path = "../crates/sfr-core" }
# The same pins as the sfr crate (root Cargo.toml [workspace.dependencies]), for crl_parse, which
# includes crates/sfr/src/certs.rs.
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["alloc"] }

[[bin]]
name = "ulog_ingest"
path = "fuzz_targets/ulog_ingest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sfr_verify"
path = "fuzz_targets/sfr_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rules_parse"
path = "fuzz_targets/rules_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crl_parse"
path = "fuzz_targets/crl_parse.rs"
test = false
doc = false
bench = false

[workspace]
