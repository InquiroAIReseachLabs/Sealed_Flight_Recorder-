[package]
name = "sfr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sealed Flight Record engine: ingest, events, rules, record, Merkle, signing, verify. No I/O beyond provided byte streams, no networking."

[lib]
path = "src/lib.rs"

[dependencies]
# Cryptography on every target (SPEC B1.10 Crypto): SHA-256, Ed25519, and the supplementary BLAKE3
# digest of the raw log bytes (founder ruling; never anchors trust).
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
