[package]
name = "sfr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sealed Flight Record engine: ingest, events, rules, record, Merkle, signing, verify. No I/O beyond provided byte streams, no networking."

[lib]
path = "src/lib.rs"

[dependencies]
# Cryptography on every target (SPEC B1.10 Crypto): SHA-256, Ed25519, and the BLAKE3 index
# digest of the raw log bytes (never anchors trust).
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }

# On aarch64 blake3's NEON code is C, which needs a C cross compiler; with no_neon it is Rust
# only, so rust-lld links every target with no C toolchain (scripts/build_release.sh). The
# digest is the same; only the speed of the BLAKE3 index digest changes.
[target.'cfg(target_arch = "aarch64")'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[lints]
workspace = true
