[package]
name = "sfr-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser build of sfr-core for the hosted sandbox. Thin wrapper."

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
sfr-core = { path = "../sfr-core" }
zeroize = { workspace = true }

# The page's bindings (src/bindings.rs) exist on wasm32 only; on every other target this crate
# is the plain Rust API that crates/sfr/tests/sandbox.rs holds to the CLI.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[lints]
workspace = true
