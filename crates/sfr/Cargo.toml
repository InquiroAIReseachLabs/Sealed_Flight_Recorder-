[package]
name = "sfr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sealed Flight Record command line: seal, verify, keygen. Thin wrapper over sfr-core."

[[bin]]
name = "sfr"
path = "src/main.rs"

[dependencies]
sfr-core = { path = "../sfr-core" }
zeroize = { workspace = true }
getrandom = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pki-types = { workspace = true }

# The sandbox engine, held to the CLI's output in tests/sandbox.rs.
[dev-dependencies]
sfr-wasm = { path = "../sfr-wasm" }

[lints]
workspace = true
