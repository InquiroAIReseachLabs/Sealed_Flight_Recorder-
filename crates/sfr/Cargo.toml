[package]
name = "sfr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sealed Flight Record command line: seal, verify, keygen. Thin wrapper over sfr-core."

[[bin]]
name = "sfr"
path = "src/main.rs"

[dependencies]
sfr-core = { path = "../sfr-core" }
zeroize = { workspace = true }
getrandom = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pki-types = { workspace = true }

[features]
# Test builds only: lets SFR_PKCS11_HELPER name the PKCS#11 helper. Off by default; a build with
# it and without debug assertions (any release profile) fails to compile (src/main.rs).
dev-helper = []

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
