# Sealed Flight Record CI (SPEC B1.10). Every job is a binary gate.
# Local equivalent: scripts/validate.sh
name: CI

# One run per pushed commit. A pull request shows the run of its head commit; a
# pull_request trigger as well would run every push to a PR branch twice, and its run would
# test a merge commit, not the commit a gate report cites.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to a branch cancels the run still checking an older commit of that branch;
# every commit on main keeps its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  code-quality:
    name: rustfmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          cargo --version --verbose
      - name: forbid(unsafe_code) in every crate root
        run: |
          set -euo pipefail
          for f in crates/*/src/lib.rs crates/*/src/main.rs; do
            [ -f "$f" ] || continue
            grep -q '^#!\[forbid(unsafe_code)\]' "$f" || { echo "missing #![forbid(unsafe_code)]: $f"; exit 1; }
          done
      - name: One crypto stack on every target, sha2, ed25519-dalek, blake3 (SPEC B1.10 Crypto)
        run: scripts/check_crypto_graph.sh
      - name: rustfmt --check
        run: cargo fmt --all --check
      - name: clippy, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The "tests:" line is what scripts/regen_readme_numbers.sh copies into the README.
      - name: cargo test --locked
        run: |
          set -euo pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
          awk '/^test result:/ { p += $4; f += $6; i += $8 }
            END { printf "tests: %d passed, %d failed, %d ignored (cargo test --workspace --locked)\n", p, f, i }' test.log \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The test certificates are what scripts/testdata/make_test_pki.sh makes
        run: scripts/testdata/make_test_pki.sh --check
      - name: README numbers come only from docs/receipts/ci-run.txt (SPEC B1.10 Reproducible claims)
        run: |
          set -euo pipefail
          scripts/regen_readme_numbers.sh --self-test
          scripts/regen_readme_numbers.sh --check
      - name: Standalone verify of 10,000 events under 10 ms (SPEC B1.10 Performance, release build)
        run: |
          set -euo pipefail
          cargo test --release --locked -p sfr --test verify_perf -- --ignored --nocapture 2>&1 | tee verify-perf.log
          {
            echo "### Standalone verify, 10,000 events (SPEC B1.10)"
            echo
            grep -E '^perf: ' verify-perf.log | sed -e 's/^perf: /- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Hardware key custody (SPEC B1.10 Key custody): pkcs11-token through sfr-pkcs11-helper
  # against a SoftHSM v2 token (CKM_EDDSA), and tpm-sealed against swtpm behind tpm2-abrmd.
  # scripts/hardware_keys.sh makes the token, its Ed25519 key and the TPM's storage key, and
  # runs crates/sfr/tests/hardware.rs with its ignored tests included.
  hardware-keys:
    name: pkcs11-token on SoftHSM v2 and tpm-sealed on swtpm (SPEC B1.10 Key custody)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
      - name: Install SoftHSM v2, OpenSC, swtpm, tpm2-tools and tpm2-abrmd
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q softhsm2 opensc swtpm swtpm-tools tpm2-tools tpm2-abrmd \
            libtss2-tcti-tabrmd0 dbus
          softhsm2-util --version
          tpm2_create --version
      - name: Hardware key custody tests
        run: scripts/hardware_keys.sh

  # The static armv7 build and the comparison of its records with x86_64 run in release-build
  # and records, from the release tarballs, beside this job.
  armv7:
    name: armv7 full test suite under QEMU (SPEC B1.10 armv7)
    runs-on: ubuntu-24.04
    env:
      # Rust's own linker and the target's bundled musl startup files: no cross C toolchain.
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml) and QEMU user-mode emulation
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add armv7-unknown-linux-musleabihf
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          # Run 32-bit ARM executables through QEMU, so the tests can start the armv7 sfr.
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            sudo sh -c 'cat /usr/lib/binfmt.d/qemu-arm.conf > /proc/sys/fs/binfmt_misc/register'
          fi
          qemu-arm-static --version | head -1
      # Profile qemu-test (Cargo.toml): optimized, with overflow checks and debug assertions on;
      # an unoptimized build under emulation was the slowest step of CI. sfr-pkcs11-helper is left
      # out: it loads a vendor PKCS#11 module with dlopen, which a static musl build cannot do, so
      # it is the one dynamically linked program and is never built for musl (SPEC B1.2).
      - name: Full test suite on armv7 under QEMU (correctness only; no armv7 timing is gated)
        run: >-
          cargo test --workspace --exclude sfr-pkcs11-helper --locked --profile qemu-test
          --target armv7-unknown-linux-musleabihf

  golden-oracle:
    name: golden files agree with the independent pyulog oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compare testdata/expected with testdata/expected/oracle (Python standard library only)
        run: scripts/testdata/regenerate.sh compare
      - name: The benchmark segment manifest matches the golden VTOL flight
        run: |
          python3 -I scripts/benchmark/make_segments.py --check scripts/benchmark/vtol_transition.segments \
            testdata/sitl/v1.17.0/vtol_transition.ulg testdata/sitl/v1.17.0/vtol_transition.ulg

  fuzz:
    name: fuzz ulog_ingest, sfr_verify and rules_parse for 60 s each (SPEC B1.10)
    runs-on: ubuntu-24.04
    env:
      # cargo-fuzz sets its own sanitizer flags; -D warnings still applies to the target.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-18 --profile minimal
          cargo +nightly-2026-10-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target 60 seconds from its committed seeds
        run: |
          set -euo pipefail
          echo "| Target | libFuzzer summary |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for t in ulog_ingest sfr_verify rules_parse; do
            mkdir -p fuzz/corpus/$t
            cp fuzz/seeds/$t/* fuzz/corpus/$t/
            cargo +nightly-2026-10-18 fuzz run $t fuzz/corpus/$t -- \
              -max_total_time=60 -rss_limit_mb=2048 -timeout=10 -max_len=1048576 \
              2>&1 | tee fuzz-$t.log
            done_line="$(grep -E '^Done [0-9]+ runs' fuzz-$t.log | tail -1)"
            echo "$t: $done_line"
            echo "| $t | $done_line |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep any finding
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  no-network:
    name: deny list (networking and async runtimes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Deny-list self-test
        run: scripts/check_deny_list.sh --self-test
      - name: Deny-list check against the full dependency graph
        run: scripts/check_deny_list.sh

  supply-chain:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (commit; the tag is annotated)
        with:
          command: check licenses advisories bans sources
          arguments: --all-features --locked

  language:
    name: language rules (SPEC B1.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Language self-test
        run: scripts/check_language.sh --self-test
      # The forbidden-terms list (target and company names) is never committed: CI reads it from
      # the repository secret SFR_FORBIDDEN_TERMS, one term per line, when the secret is set.
      - name: No em-dash, compliance claim, codename, or banned term (scripts/check_language.sh)
        env:
          SFR_FORBIDDEN_TERMS: ${{ secrets.SFR_FORBIDDEN_TERMS }}
        run: |
          set -euo pipefail
          if [ -n "${SFR_FORBIDDEN_TERMS:-}" ]; then
            printf '%s\n' "$SFR_FORBIDDEN_TERMS" > "$RUNNER_TEMP/forbidden-terms"
            export SFR_FORBIDDEN_TERMS_FILE="$RUNNER_TEMP/forbidden-terms"
          fi
          scripts/check_language.sh
      - name: No private key in the repository (scripts/check_no_private_keys.sh)
        run: |
          set -euo pipefail
          scripts/check_no_private_keys.sh --self-test
          scripts/check_no_private_keys.sh
      - name: No email address in the repository, example.com and example.org aside (scripts/check_no_emails.sh)
        run: |
          set -euo pipefail
          scripts/check_no_emails.sh --self-test
          scripts/check_no_emails.sh

  # Every shell command in the public docs runs, or is syntax-checked when it cannot run here,
  # and every output block shown in a doc must equal what the command printed; every number has a
  # source and every relative link resolves (scripts/check_docs.py). The README quickstart builds
  # sfr from this commit; RECORD_FORMAT.md checks a golden record with openssl and b3sum alone.
  docs:
    name: docs tests (every doc command run and its output compared; numbers, links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml) and b3sum 1.8.7, the blake3 crate's version
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo install b3sum --version 1.8.7 --locked
      - name: The tools the docs use
        run: |
          set -euo pipefail
          openssl version
          b3sum --version
          python3 --version
          bash --version | head -1
      - name: Docs test self-test
        run: python3 -I scripts/check_docs.py --self-test
      - name: Docs tests (scripts/check_docs.py)
        run: python3 -I scripts/check_docs.py

  # The release workflows' own rules and tests (.github/workflows/release.yml, docs/RELEASE.md):
  # the workflow rules, the hygiene scan, and the offline signing flow with a throwaway key.
  release-scripts:
    name: release workflow rules, hygiene scan and offline signing flow (SPEC B1.10 Releases)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install exiftool for the hygiene scan
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q libimage-exiftool-perl
      - name: Workflow rules, signing script, hygiene scan, signing flow
        run: |
          set -euo pipefail
          scripts/check_workflows.sh --self-test
          scripts/check_workflows.sh
          scripts/release_sign.sh --self-test
          scripts/check_release_hygiene.sh --self-test
          scripts/check_release_flow.sh
          scripts/regen_readme_numbers.sh --self-test

  # The engine bundle: built from this commit, checked, then driven in three browser
  # engines through its test harness page by tests/browser/sandbox.test.mjs. Safari itself
  # cannot run on a Linux runner; WebKit is its engine. The bundle is kept as the artifact
  # sfr-engine-<commit>, with SHA256SUMS and BUILDINFO inside (docs/SANDBOX.md).
  sandbox:
    name: engine bundle in Chromium, Firefox and WebKit; same records as the CLI; user files never sent (SPEC B1.10 Sandbox)
    runs-on: ubuntu-24.04
    env:
      # wasm-bindgen-cli: the release binary of the version Cargo.lock pins, checked against the
      # SHA-256 its release publishes (wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz.sha256sum).
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The browsers install in the background while the engine, the harness and the CLI build.
      - name: Install the toolchain, wasm-bindgen-cli and the browsers; build the bundle, the harness and the CLI from this commit
        run: |
          set -euo pipefail
          (cd tests/browser && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox webkit) \
            > playwright-install.log 2>&1 &
          browsers=$!
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          name="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wb.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$name.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/wb.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wb.tar.gz"
          export WASM_BINDGEN="$RUNNER_TEMP/$name/wasm-bindgen"
          cargo clippy -p sfr-wasm --target wasm32-unknown-unknown --locked -- -D warnings
          scripts/build_site.sh dist/site
          scripts/check_engine_bundle.sh --self-test
          scripts/check_engine_bundle.sh dist/site/engine "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          SFR_BUILD_COMMIT="$(git rev-parse HEAD)" cargo build --release --locked -p sfr
          wait "$browsers" || { cat playwright-install.log; exit 1; }
      # The "PASS"/"FAIL" lines and summary.md are the gate's evidence.
      - name: Headless browser gate (tests/browser/sandbox.test.mjs)
        run: |
          set -euo pipefail
          node tests/browser/sandbox.test.mjs --site dist/site --sfr target/release/sfr --out sandbox-test 2>&1 | tee sandbox-test.log
          cat sandbox-test/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sfr-engine-${{ github.sha }}
          path: dist/site/engine/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: sandbox-test-screenshots
          path: |
            sandbox-test/*.png
            sandbox-test/summary.md
            sandbox-test/summary.json
          if-no-files-found: warn
          retention-days: 30

  # Release artifacts. These jobs run beside the gates above and build everything a
  # release holds, unsigned: the three static tarballs, the benchmark kit, the demo image, one
  # SBOM per target, and SHA256SUMS. They publish nothing; the release key holder signs SHA256SUMS offline
  # and makes the release (docs/RELEASE.md).
  release-build:
    name: static ${{ matrix.target }} tarball, built twice from clean (SPEC B1.10 Static binaries)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml) and this target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      # rust-lld and the target's own musl startup files; readelf shows no INTERP and no NEEDED,
      # file reports static. Two builds from clean must give identical bytes.
      - name: Build with rust-lld twice from clean; check static; compare binaries and tarballs
        run: |
          set -euo pipefail
          scripts/check_reproducible.sh "${{ matrix.target }}" dist | tee reproducible.log
          tarball="$(ls dist/sfr-*-${{ matrix.target }}.tar.gz)"
          tar -xzOf "$tarball" --wildcards '*/BUILDINFO' | tee buildinfo.txt
          {
            echo "### ${{ matrix.target }}"
            echo
            sed 's/^/- /' reproducible.log
            grep -E '^(file|sha256 bin/sfr):' buildinfo.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release-kit-sbom:
    name: benchmark kit and one CycloneDX SBOM per target (SPEC B1.10 Supply chain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain (rust-toolchain.toml) and cargo-cyclonedx
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Benchmark kit, then the SBOMs for x86_64, aarch64 and armv7
        run: |
          set -euo pipefail
          scripts/build_benchmark_kit.sh dist
          scripts/release_sbom.sh dist | tee sboms.log
          for f in $(cat sboms.log); do
            jq -r --arg f "$(basename "$f")" '"- \($f): \(.metadata.properties[] | select(.name == "cdx:rustc:sbom:target:triple") | .value), \(.components | length) components"' "$f"
          done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-kit-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 3

  demo:
    name: demo image; run_demo.sh under docker run --network=none in under 60 s (SPEC B1.10 No network)
    needs: release-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-x86_64-unknown-linux-musl
          path: dist
      - name: Build the image from the x86_64 release tarball and save it
        run: scripts/build_demo_image.sh dist/sfr-*-x86_64-unknown-linux-musl.tar.gz image
      # A clean machine: every image and the build cache are removed, the saved image is loaded,
      # and the demo runs with no network. The "demo:" line is what the README copies.
      - name: From the saved image alone, docker run --network=none runs run_demo.sh in under 60 s
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          docker system prune -af > /dev/null
          docker load -i "image/sfr-$version-demo-image.tar.gz"
          start="$EPOCHREALTIME"
          docker run --rm --network=none "sfr-demo:$version" | tee demo.log
          wall="$(awk -v a="$start" -v b="$EPOCHREALTIME" 'BEGIN { printf "%.2f", b - a }')"
          echo "demo: docker run --network=none, image loaded from its saved tarball, wall time $wall s" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^DEMO PASSED in ' demo.log
          awk -v w="$wall" 'BEGIN { exit !(w < 60) }' || { echo "the demo took $wall s, not under 60 s"; exit 1; }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-demo-image
          path: image/
          if-no-files-found: error
          retention-days: 3

  records:
    name: every golden log seals to the same bytes on x86_64, aarch64 and armv7 (QEMU) (SPEC B1.10 Deterministic, armv7)
    needs: release-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*-unknown-linux-*
          path: dist
          merge-multiple: true
      - name: Install QEMU user-mode emulation
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
      # The release binaries of the three tarballs; aarch64 and armv7 run through QEMU wrappers.
      # The "byte-identical" lines are what the README copies.
      - name: Seal every golden log with the x86_64, aarch64 and armv7 release binaries; compare
        run: |
          set -euo pipefail
          mkdir bin
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            tar -C bin -xzf dist/sfr-*-$t.tar.gz
          done
          x86="$(ls -d "$PWD"/bin/sfr-*-x86_64-unknown-linux-musl)/bin/sfr"
          for arch in aarch64:aarch64-unknown-linux-musl armv7:armv7-unknown-linux-musleabihf; do
            name="${arch%%:*}" target="${arch#*:}"
            qemu="qemu-${name/armv7/arm}-static"
            printf '#!/bin/sh\nexec %s %s "$@"\n' "$qemu" "$(ls -d "$PWD"/bin/sfr-*-"$target")/bin/sfr" > "sfr-$name"
            chmod +x "sfr-$name"
            scripts/check_same_records.sh "$x86" "$PWD/sfr-$name" "x86_64 and $name" | tee "same-records-$name.log"
          done
          { echo "### Records sealed on x86_64, aarch64 and armv7"; echo; tail -qn1 same-records-*.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

  # No source checkout and no Rust: the two tarballs, in debian:12-slim with GNU time added.
  benchmark:
    name: benchmark from the x86_64 release tarball, no build tools (SPEC B1.10 Performance, Peak memory)
    needs: [release-build, release-kit-sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-kit-sbom
          path: dist
      - name: scripts/benchmark.sh in debian:12-slim from the unpacked tarballs
        run: |
          set -euo pipefail
          mkdir bench
          tar -C bench -xzf dist/sfr-*-x86_64-unknown-linux-musl.tar.gz
          tar -C bench -xzf dist/sfr-*-benchmark.tar.gz
          docker run --rm -v "$PWD/bench:/w" -w /w \
            debian:12-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 bash -c '
              set -euo pipefail
              apt-get -qq update
              apt-get -qq install -y --no-install-recommends time > /dev/null
              sfr-*-benchmark/scripts/benchmark.sh --sfr sfr-*-x86_64-unknown-linux-musl/bin/sfr' | tee benchmark.txt
          { echo "### Benchmark (scripts/benchmark.sh)"; echo; grep -E '^(benchmark|hardware|gate|memory): ' benchmark.txt | sed 's/^/- /'; echo; grep -E '^\| ' benchmark.txt; } >> "$GITHUB_STEP_SUMMARY"

  release-assemble:
    name: SHA256SUMS over every artifact; release signing script with a test key (SPEC B1.10 Releases)
    needs: [release-build, release-kit-sbom, demo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The release key never reaches CI: a throwaway key signs, the documented openssl command
      # verifies, and neither the key nor the signature is kept.
      - name: SHA256SUMS over every artifact; sign with a test key; verify with openssl alone
        run: |
          set -euo pipefail
          scripts/release_sign.sh --self-test
          scripts/release_assemble.sh dist | tee sha256sums.log
          key="$RUNNER_TEMP/test-release.key" pub="$RUNNER_TEMP/test-release.pub"
          openssl genpkey -algorithm ed25519 -out "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          # The signing script signs the GitHub release's list: the three tarballs and the three
          # SBOMs (.github/workflows/release.yml), not the benchmark kit and the demo image.
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          mkdir gh
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cp "dist/sfr-$version-$t.tar.gz" "dist/sfr-$version-$t.cdx.json" gh/
          done
          scripts/release_assemble.sh --set github gh > /dev/null
          scripts/release_sign.sh sign gh/SHA256SUMS "$key" --pubkey "$pub"
          (cd gh && openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig && sha256sum --check --strict SHA256SUMS)
          rm -f "$key"
          { echo "### SHA256SUMS (unsigned)"; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sfr-release-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30
