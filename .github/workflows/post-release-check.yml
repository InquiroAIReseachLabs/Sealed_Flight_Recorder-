# After a release is published: do the download steps of docs/RELEASE.md work on clean runners?
#
# The commands are that page's own: scripts/check_docs.py --release runs every fenced block
# marked doc-release in docs/RELEASE.md, in order, in an empty directory, with nothing from the
# repository on the path. The checks of the release itself (its file list, its key, its
# attestations) run beside it. Writes nothing, uses no secret, and holds no key.
name: post-release-check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of a published release to check, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  quickstart:
    name: download steps on ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, qemu: "no" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, qemu: "no" }
          - { target: armv7-unknown-linux-musleabihf, runner: ubuntu-24.04, qemu: "yes" }
    steps:
      # Only docs/RELEASE.md and the check script come from the repository, at the released tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: repo
      - name: Run armv7 executables through QEMU
        if: matrix.qemu == 'yes'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            sudo sh -c 'cat /usr/lib/binfmt.d/qemu-arm.conf > /proc/sys/fs/binfmt_misc/register'
          fi
      - name: The download steps of docs/RELEASE.md in an empty directory
        env:
          SFR_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export SFR_VERSION="${TAG#v}"
          work="$(mktemp -d)"
          python3 -I repo/scripts/check_docs.py --release "$work" | tee quickstart.log
          fp="$(openssl pkey -pubin -in repo/release/sfr-release.pub -outform DER | sha256sum | cut -d' ' -f1)"
          grep -q -F "sha256:$fp" quickstart.log || { echo "the download steps did not print the committed release key's fingerprint"; exit 1; }
          { echo "### Download steps, ${{ matrix.target }}"; echo; grep -E '^(PASS|release key|SFR )' quickstart.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

  release-facts:
    name: the published release holds exactly its files, its key and its attestations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Files, flags, key fingerprint, attestations
        run: |
          set -euo pipefail
          version="${TAG#v}"
          state="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"')"
          [ "$state" = "draft=false prerelease=true" ] || { echo "unexpected release state: $state"; exit 1; }
          got="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          want="$(
            for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
              echo "sfr-$version-$t.tar.gz"; echo "sfr-$version-$t.cdx.json"
            done
            echo SHA256SUMS; echo SHA256SUMS.sig; echo sfr-release.pub
          )"
          want="$(printf '%s\n' "$want" | sort)"
          [ "$got" = "$want" ] || { echo "the release holds other files than it should:"; diff <(echo "$want") <(echo "$got") || true; exit 1; }
          work="$(mktemp -d)"
          gh release download "$TAG" --dir "$work"
          (cd "$work" && sha256sum --check --strict SHA256SUMS && openssl pkeyutl -verify -pubin -inkey sfr-release.pub -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig)
          fp="$(openssl pkey -pubin -in "$work/sfr-release.pub" -outform DER | sha256sum | cut -d' ' -f1)"
          [ "$fp" = "$(openssl pkey -pubin -in release/sfr-release.pub -outform DER | sha256sum | cut -d' ' -f1)" ] \
            || { echo "the release's key is not the key committed at this tag"; exit 1; }
          grep -q -F "sha256:$fp" docs/RELEASE.md || { echo "docs/RELEASE.md does not show the release key's fingerprint"; exit 1; }
          for f in "$work"/sfr-*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/${TAG:-$GITHUB_REF_NAME}" > /dev/null
            echo "attested: $(basename "$f")"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo "release facts: $state; 9 files; signature verifies; key fingerprint sha256:$fp matches the repository" | tee -a "$GITHUB_STEP_SUMMARY"
