# Nightly fuzzing (SPEC B1.10 "Fuzzing"): 10 minutes per target, zero panics, hangs, or OOM.
name: Fuzz nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ulog-ingest:
    name: fuzz ulog_ingest for 10 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-18 --profile minimal
          cargo +nightly-2026-10-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Run 10 minutes from the committed seeds
        run: |
          set -euo pipefail
          mkdir -p fuzz/corpus/ulog_ingest
          cp fuzz/seeds/ulog_ingest/* fuzz/corpus/ulog_ingest/
          cargo +nightly-2026-10-18 fuzz run ulog_ingest fuzz/corpus/ulog_ingest -- \
            -max_total_time=600 -rss_limit_mb=2048 -max_len=1048576
      - name: Keep any finding
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
