# Nightly fuzzing (SPEC B1.10 "Fuzzing"): 10 minutes per target, zero panics, hangs, or OOM.
name: Fuzz nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ulog-ingest:
    name: fuzz ulog_ingest and sfr_verify for 10 minutes each
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-18 --profile minimal
          cargo +nightly-2026-10-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target 10 minutes from its committed seeds
        run: |
          set -euo pipefail
          echo "| Target | libFuzzer summary |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for t in ulog_ingest sfr_verify; do
            mkdir -p fuzz/corpus/$t
            cp fuzz/seeds/$t/* fuzz/corpus/$t/
            cargo +nightly-2026-10-18 fuzz run $t fuzz/corpus/$t -- \
              -max_total_time=600 -rss_limit_mb=2048 -timeout=10 -max_len=1048576 \
              2>&1 | tee fuzz-$t.log
            done_line="$(grep -E '^Done [0-9]+ runs' fuzz-$t.log | tail -1)"
            echo "$t: $done_line"
            echo "| $t | $done_line |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep any finding
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
